<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#182535"><title>Little Layers</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#152535;color:#f6f1e8;font-family:system-ui,Arial,sans-serif}button,input,select{font:inherit}button{border:1px solid #ffffff35;border-radius:12px;background:#34465b;color:#fff;padding:10px 12px;cursor:pointer}button:active{transform:scale(.97)}button.selected{background:#8a667a;border-color:#ffd9b4}header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:14px 15px}h1{font-size:20px;margin:0}header small{color:#c4cbd4}main{max-width:780px;margin:auto;padding:0 12px 30px}.scene{position:relative;background:linear-gradient(140deg,#f4d5bd,#a7b5c7);border:12px solid #d7b08d;border-bottom-color:#916746;border-right-color:#ad805b;box-shadow:inset 0 0 25px #362b3977,0 16px 45px #070f1780;border-radius:20px;overflow:hidden;aspect-ratio:4/5;max-height:69dvh;min-height:300px;touch-action:pan-y}.scene svg{width:100%;height:100%;display:block;filter:drop-shadow(0 4px 3px #14243335)}.panel{background:#23384c;border:1px solid #ffffff29;border-radius:18px;padding:12px;margin:12px 0}.toolbar{display:flex;gap:7px;flex-wrap:wrap}.toolbar button{flex:1 1 auto;font-size:13px}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.row label{font-size:13px;display:flex;gap:8px;align-items:center}.row input{accent-color:#edae94}.row select{background:#34465b;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:8px}.muted{font-size:12px;color:#c3cad4}.tip{font-size:12px;color:#e6d1be;margin:8px 2px}.actions{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}#toast{min-height:20px;color:#ffdbb8;font-size:12px}button:focus-visible{outline:2px solid #fff}@media(max-width:390px){.scene{min-height:320px}.toolbar button{padding:9px 7px}}

</style></head><body>
<header><div><h1>Little Layers</h1><small>Build paper worlds, one layer at a time</small></div><div class="buttons"><button id="export">Save PNG</button><button id="project-save">Project ↓</button><button id="project-open">Open ↑</button><input id="project-file" type="file" accept=".json,application/json" hidden></div></header>
<main>
<div class="scene"><svg id="art" viewBox="0 0 400 500" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Layered paper diorama"></svg></div>
<div class="panel">
<div class="toolbar" aria-label="Add a paper layer">
<button data-kind="hill">＋ Hills</button><button data-kind="mountain">＋ Mountains</button><button data-kind="forest">＋ Forest</button><button data-kind="waves">＋ Waves</button><button data-kind="cloud">＋ Clouds</button><button data-kind="stars">＋ Stars</button><button data-kind="fog">＋ Fog</button>
</div>
<p class="tip">Tap a layer to select, then drag it to reposition. Adjust its depth and color, or move it forward and backward.</p>
<div class="row"><label>Theme <select id="theme"><option value="sunset">Sunset</option><option value="twilight">Twilight</option><option value="daybreak">Daybreak</option><option value="sea">Sea Glass</option></select></label><label>Depth <input id="depth" type="range" min="0" max="10" value="5"></label><label>Layer size <input id="layer-size" type="range" min="55" max="155" value="100"><output id="layer-size-value">100%</output></label><label>Height <input id="layer-height" type="range" min="-180" max="150" value="0"><output id="layer-height-value">0</output></label><label>Light direction <input id="light-angle" type="range" min="-90" max="90" value="35"></label><label>Shadow distance <input id="shadow-distance" type="range" min="0" max="18" value="7"></label><label>Color <input id="color" type="color" value="#638a85"></label><label>Variation <select id="variation"><option value="0">Classic</option><option value="1">Detailed</option><option value="2">Wild</option><option value="3">Soft</option></select></label><label>Gradient <select id="gradient"><option value="flat">Solid</option><option value="darkLight">Dark → light</option><option value="lightDark">Light → dark</option></select></label><label>Edge <select id="edge"><option value="cut">Clean cut</option><option value="torn">Torn paper</option><option value="deckle">Deckled</option></select></label><label>Texture <select id="texture"><option value="card">Cardstock</option><option value="fiber">Handmade fibers</option><option value="grain">Fine grain</option><option value="none">None</option></select></label></div>
<div class="actions"><button id="back">Send back</button><button id="forward">Bring forward</button><button id="remove">Remove</button><button id="undo">Undo</button><button id="reset">New scene</button><button id="motion" aria-pressed="false">▶ Motion</button></div>
<div id="toast" role="status"></div><div class="muted">Your scene saves automatically on this device. Export PNG for sharing. No account or AI required.</div>
</div></main>
<script>
(()=>{
const svg=document.getElementById('art'),ns='http://www.w3.org/2000/svg',storage='little-layers-v1';
const schemes={sunset:['#fbddc0','#ecafab','#8e849e','#597d87','#2e5864'],twilight:['#1b2745','#34355c','#5d5680','#6b6483','#293b54'],daybreak:['#c7e4ec','#e6c7a6','#98b4a2','#618c92','#396d6c'],sea:['#e2f0dc','#b9d6c9','#83b7b6','#5f929e','#366877']};
let state={theme:'sunset',layers:[],lightAngle:35,shadowDistance:7},selected=-1,history=[],drag=null,motion=false,phase=0,motionId=0;
function notify(t){document.getElementById('toast').textContent=t}
function save(){try{localStorage.setItem(storage,JSON.stringify(state))}catch(e){notify('Storage unavailable; export PNG to keep your art.')}}
function snapshot(){history.push(JSON.stringify(state));if(history.length>30)history.shift()}
function el(tag,props={},parent=null){const e=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(props))e.setAttribute(k,String(v));if(parent)parent.appendChild(e);return e}
function path(d,fill){return el('path',{d,fill})}
function shade(hex,amount){const v=parseInt(hex.slice(1),16);return '#'+[16,8,0].map(shift=>Math.max(0,Math.min(255,Math.round(((v>>shift)&255)+amount))).toString(16).padStart(2,'0')).join('')}
function seeded(seed){let n=(Number(seed)||1)>>>0;return()=>{n=(Math.imul(n,1664525)+1013904223)>>>0;return n/4294967296}}
function proceduralRange(g,item,index,c,p){
 const rand=seeded(item.seed),kind=item.kind,v=Number(item.variation)||0;
 if(kind==='mountain'){
  const peaks=[];let x=-55;let y=415;const vertices=[[-55,455]];
  while(x<480){x+=55+rand()*80;const summit=178+rand()*143+(v===3?42:0)-(v===2?25:0);vertices.push([x,summit]);peaks.push({x,y:summit});if(x<460){x+=25+rand()*45;vertices.push([x,330+rand()*60])}}
  vertices.push([510,455]);
  p('M'+vertices.map(([a,b])=>a+' '+b).join(' L')+' L510 540 H-55Z');
  for(let i=0;i<vertices.length;i++){const pt=vertices[i];if(!peaks.some(k=>k.x===pt[0]))continue;const prev=vertices[i-1],next=vertices[i+1];if(!prev||!next)continue;const t=.24;const left=[pt[0]+(prev[0]-pt[0])*t,pt[1]+(prev[1]-pt[1])*t],right=[pt[0]+(next[0]-pt[0])*t,pt[1]+(next[1]-pt[1])*t];p(`M${left[0]} ${left[1]}L${pt[0]} ${pt[1]}L${right[0]} ${right[1]}L${pt[0]+3} ${pt[1]+(right[1]-pt[1])*.63}L${pt[0]-5} ${pt[1]+(left[1]-pt[1])*.72}Z`,shade(item.color,58))}
  return true
 }
 if(kind==='hill'){let d='M-35 420';for(let x=-35;x<470;x+=35){const next=x+35;const y=310+rand()*95+(v===3?25:0);d+=` Q${x+18} ${y-28-rand()*22} ${next} ${y}`}p(d+' L480 550 H-35Z');return true}
 if(kind==='forest'){
  p('M-25 465 Q160 418 430 453 V540 H-25Z');const count=8+Math.floor(rand()*8)+(v===1?5:0);
  for(let i=0;i<count;i++){const x=-15+i*(445/count)+rand()*12,base=440+rand()*24,h=60+rand()*82+(v===2?30:0),top=base-h,width=14+rand()*13;g.appendChild(el('path',{d:`M${x-3} ${base-h*.55}H${x+3}V${base+18}H${x-3}Z`,fill:shade(item.color,-55)}));
  if(v===3)p(`M${x-width} ${base-8}Q${x-width*1.3} ${top+16} ${x} ${top}Q${x+width*1.3} ${top+16} ${x+width} ${base-8}Z`);
  else p(`M${x} ${top}L${x-width*.68} ${top+h*.5}H${x-width*.43}L${x-width} ${base-9}H${x+width}L${x+width*.43} ${top+h*.5}H${x+width*.68}Z`);
  g.appendChild(el('path',{d:`M${x} ${base-10}V${base+18}`,stroke:shade(item.color,-60),'stroke-width':5}))}
  return true
 }
 if(kind==='cloud'){const count=2+Math.floor(rand()*4)+(v===3?1:0);for(let i=0;i<count;i++){const x=25+i*380/count+rand()*30,y=72+rand()*120,k=.9+rand()*.55,cloud=el('g',{transform:`translate(${x} ${y}) scale(${k})`},g);cloud.appendChild(path('M-54 18 C-73 12 -65 -12 -43 -16 C-41 -37 -15 -43 0 -29 C15 -52 45 -35 47 -17 C72 -18 80 8 59 19 Q0 31 -54 18Z',c))}return true}
 if(kind==='waves'){const amp=9+rand()*26;let d='M-35 370';for(let x=-35;x<480;x+=48){d+=` Q${x+24} ${370-amp-rand()*13} ${x+48} ${370+rand()*10}`}p(d+' V540 H-35Z');for(let j=0;j<4;j++){const y=398+j*30;g.appendChild(el('path',{d:`M-30 ${y}Q50 ${y-amp*.7} 125 ${y}T285 ${y}T445 ${y}`,stroke:shade(item.color,34),'stroke-width':1.8,fill:'none'}))}return true}
 if(kind==='stars'){for(let i=0,n=20+Math.floor(rand()*50);i<n;i++){const x=rand()*400,y=rand()*260,r=1+rand()*3;g.appendChild(el('circle',{cx:x,cy:y,r,fill:c}))}return true}
 if(kind==='fog'){for(let i=0,n=3+Math.floor(rand()*5);i<n;i++){const y=110+i*330/n+rand()*20,h=14+rand()*24;g.appendChild(el('path',{d:`M-30 ${y}Q70 ${y-h} 160 ${y}T420 ${y}V${y+h}Q280 ${y+h+15} 160 ${y+h}T-30 ${y+h}Z`,fill:c,opacity:.2+rand()*.25}))}return true}
 return false
}
function silhouette(g,item,index){const kind=item.kind,v=Number(item.variation)||0,c=item.gradient&&item.gradient!=='flat'?'url(#layergrad'+index+')':item.color;
const p=(d,fill=c)=>g.appendChild(path(d,fill));
if(Number.isFinite(item.seed)&&proceduralRange(g,item,index,c,p))return;
if(kind==='hill'){const rise=[0,24,50,-17][v];p(`M-25 430 Q35 ${320-rise} 105 ${373-rise*.25} Q170 ${298-rise} 235 ${358+rise*.3} Q305 ${272-rise*.3} 430 369 L430 540 H-25Z`);if(v===1||v===2){for(let i=0;i<10;i++){const x=i*47,y=392+Math.sin(i*1.9)*24;g.appendChild(el('path',{d:`M${x-11} ${y+4} Q${x} ${y-9} ${x+10} ${y+4}`,fill:'none',stroke:shade(item.color,24),'stroke-width':2}))}}}
if(kind==='mountain'){const h=[0,36,72,-22][v];p(`M-40 430 L40 ${336-h*.3} L98 ${237-h} L152 338 L240 ${210-h*.7} L310 307 L367 ${252-h*.4} L445 430 V540 H-40Z`);for(const peak of [{x:98,y:237-h,left:[40,336-h*.3],right:[152,338]},{x:240,y:210-h*.7,left:[152,338],right:[310,307]},{x:367,y:252-h*.4,left:[310,307],right:[445,430]}]){const a=.27,b=.29;const lx=peak.x+(peak.left[0]-peak.x)*a,ly=peak.y+(peak.left[1]-peak.y)*a,rx=peak.x+(peak.right[0]-peak.x)*b,ry=peak.y+(peak.right[1]-peak.y)*b;p(`M${lx} ${ly} L${peak.x} ${peak.y} L${rx} ${ry} L${peak.x+4} ${peak.y+(ry-peak.y)*.7} L${peak.x-6} ${peak.y+(ly-peak.y)*.8}Z`,shade(item.color,48))}if(v===2)p('M164 360 L230 289 L203 360Z',shade(item.color,-35))}
if(kind==='forest'){p('M-20 462 Q150 411 420 452 V540 H-20Z');const step=[36,26,42,51][v];for(let i=-30;i<455;i+=step){const n=Math.floor(i/step),x=i+((n*17)%13),height=58+((n*n*11+37)%54)+(v===2?20:0),base=451+(n%4)*8,top=base-height;
const trunkWidth=v===3?7:6;g.appendChild(el('path',{d:`M${x-trunkWidth/2} ${top+height*.42}H${x+trunkWidth/2}V${base+19}H${x-trunkWidth/2}Z`,fill:shade(item.color,-53)}));
if(v===3){g.appendChild(el('path',{d:`M${x-19} ${base-13}Q${x-25} ${top+17} ${x} ${top}Q${x+25} ${top+17} ${x+19} ${base-13}Z`,fill:c}))}
else{p(`M${x} ${top} L${x-15} ${top+height*.41} H${x-9} L${x-23} ${base-11} H${x+23} L${x+9} ${top+height*.41} H${x+15}Z`)}
g.appendChild(el('path',{d:`M${x} ${base-5}V${base+19}`,stroke:shade(item.color,-60),'stroke-width':trunkWidth,'stroke-linecap':'square'}))
}}
if(kind==='waves'){const a=[13,23,35,7][v];p(`M-30 370 Q20 ${370-a} 72 370 T175 370 T278 370 T382 370 T485 370 V540 H-30Z`);for(let j=0;j<5;j++){const y=383+j*28;p(`M-30 ${y}Q22 ${y-a} 73 ${y}T176 ${y}T279 ${y}T382 ${y}T485 ${y}`,'none');const line=g.lastChild;line.setAttribute('stroke',shade(item.color,34));line.setAttribute('stroke-width',v===2?3:1.5)}}
if(kind==='cloud'){const count=[3,4,3,5][v];for(let i=0;i<count;i++){const x=48+i*(305/Math.max(1,count-1)),y=92+(i%2)*62,scale=v===2?1.35:1;const cloud=el('g',{transform:`translate(${x} ${y}) scale(${scale})`},g);const d='M-54 18 C-73 12 -65 -12 -43 -16 C-41 -37 -15 -43 0 -29 C15 -52 45 -35 47 -17 C72 -18 80 8 59 19 Q0 31 -54 18Z';cloud.appendChild(path(d,c));cloud.appendChild(el('path',{d:'M-35 10 Q-19 14 -7 7 M6 -20 Q18 -29 29 -16',stroke:shade(item.color,24),'stroke-width':2.5,'stroke-linecap':'round',fill:'none',opacity:.6}))}}
if(kind==='stars'){const count=[24,46,17,67][v];for(let i=0;i<count;i++){const x=10+(i*113+i*i*7)%390,y=15+(i*67+i*i*3)%270,r=v===2?3.5:1.4+(i%3);if(i%4===0)p(`M${x} ${y-r*2}L${x+r*.35} ${y-r*.35}L${x+r*2} ${y}L${x+r*.35} ${y+r*.35}L${x} ${y+r*2}L${x-r*.35} ${y+r*.35}L${x-r*2} ${y}L${x-r*.35} ${y-r*.35}Z`);else g.appendChild(el('circle',{cx:x,cy:y,r,fill:c}))}}
if(kind==='fog'){const stripes=[3,5,7,4][v];for(let i=0;i<stripes;i++){const y=160+i*(v===2?45:63),h=26+(i%3)*12;const d=`M-45 ${y}Q30 ${y-h} 100 ${y} T245 ${y} T430 ${y}L430 ${y+h}Q330 ${y+h+12} 235 ${y+h} T30 ${y+h}L-45 ${y+h}Z`;g.appendChild(el('path',{d,fill:c,opacity: v===3?.15:.3+(i%3)*.07}))}}}
function geometry(item,index){
 const group=el('g',{'data-index':index,style:'cursor:grab'}),depth=Number(item.depth)||0,offset=(10-depth)*2;
 // Extend the source horizontally, but preserve its vertical proportions.
 // Each layer can be resized and raised independently without exposing side edges.
 const size=Math.max(.55,Math.min(1.55,(Number(item.size)||100)/100));
 const defaultLift={forest:-15,hill:-42,mountain:-18,waves:-25,cloud:0,stars:0,fog:0}[item.kind]||0;
 const vertical=Number.isFinite(Number(item.height))?Number(item.height):0;
 // Isolated objects must keep their aspect ratio; terrain can overscan horizontally.
 const scenic=['hill','mountain','forest','waves','fog'].includes(item.kind);
 const sx=(scenic?1.75:1)*size,sy=(scenic?.95:1)*size;
 const art=el('g',{transform:'translate(200 250) scale('+sx+' '+sy+') translate(-200 -250)'},group);
 art.setAttribute('data-default-lift',String(defaultLift));
 group.setAttribute('data-height',String(vertical));
 const paper=el('g',{},art);silhouette(paper,item,index);
 if(item.kind!=='fog'){
  paper.setAttribute('data-edge',item.edge||'cut');
  paper.setAttribute('data-texture',item.texture||'card');
  // All materials are normal SVG shapes, never a turbulence/filter chain.
  // Clip paper grain and subtle edge ink to the actual layer silhouette.
  const tex=item.texture||'card',edge=item.edge||'cut';
  if(tex!=='none'){
   const clipId='paper-clip-'+index,clip=el('clipPath',{id:clipId,clipPathUnits:'userSpaceOnUse'});
   Array.from(paper.children).forEach(child=>{const copy=child.cloneNode(true);copy.removeAttribute('stroke');copy.removeAttribute('stroke-width');copy.setAttribute('fill','#fff');clip.appendChild(copy)});
   svg.querySelector('defs').appendChild(clip);
   const patternId='grain-'+tex,overlay=el('rect',{x:-100,y:-100,width:600,height:800,fill:'url(#'+patternId+')','clip-path':'url(#'+clipId+')','pointer-events':'none'},paper);
   overlay.setAttribute('opacity',tex==='fiber'?.45:tex==='grain'?.25:.15);
  }
  if(edge!=='cut'){
   const paths=Array.from(paper.querySelectorAll('path')).filter(n=>n.getAttribute('fill')!=='none');
   paths.forEach(pathNode=>{const contour=pathNode.cloneNode(false);contour.setAttribute('fill','none');contour.setAttribute('stroke',shade(item.color,edge==='torn'?46:25));contour.setAttribute('stroke-width',edge==='torn'?2.6:1.6);contour.setAttribute('stroke-dasharray',edge==='torn'?'1 3':'3 5');contour.setAttribute('opacity','.55');contour.setAttribute('pointer-events','none');paper.appendChild(contour)})
  }
  // Offset a dark duplicate instead of using device-sensitive SVG filters.
  const shadow=paper.cloneNode(true),angle=(Number(state.lightAngle)||0)*Math.PI/180,distance=Math.max(0,Number(state.shadowDistance)||0)*(0.35+depth*.095);
  shadow.setAttribute('transform','translate('+(Math.sin(angle)*distance)+' '+(Math.cos(angle)*distance)+')');
  shadow.setAttribute('opacity','.28');shadow.setAttribute('pointer-events','none');
  shadow.querySelectorAll('*').forEach(n=>{if(n.hasAttribute('fill')&&n.getAttribute('fill')!=='none')n.setAttribute('fill','#0e1425');if(n.hasAttribute('stroke')&&n.getAttribute('stroke')!=='none')n.setAttribute('stroke','#0e1425')});
  art.insertBefore(shadow,paper);
 }
 group.setAttribute('transform','translate('+((item.x||0)+(motion?Math.sin(phase+index)*depth*.7:0))+' '+((item.y||0)+offset+defaultLift+vertical)+')');
 if(index===selected)group.appendChild(el('rect',{x:3,y:3,width:394,height:494,fill:'none',stroke:'#ffffff','stroke-dasharray':'7 8','stroke-width':2,'pointer-events':'none'}));
 group.addEventListener('click',()=>{selected=index;sync();render()});return group
}
function render(){svg.replaceChildren();const colors=schemes[state.theme];const defs=el('defs'),grad=el('linearGradient',{id:'sky',x1:'0',y1:'0',x2:'0',y2:'1'});grad.append(el('stop',{offset:'0%','stop-color':colors[0]}),el('stop',{offset:'100%','stop-color':colors[1]}));defs.appendChild(grad);const shadow=el('filter',{id:'shadow',x:'-20%',y:'-20%',width:'140%',height:'140%'});shadow.appendChild(el('feDropShadow',{dx:0,dy:4,stdDeviation:4,'flood-color':'#101429','flood-opacity':'.48'}));defs.appendChild(shadow);
for(const [name,step] of [['card',19],['fiber',11],['grain',7]]){
 const pattern=el('pattern',{id:'grain-'+name,patternUnits:'userSpaceOnUse',width:step,height:step},defs);
 if(name==='fiber'){el('path',{d:'M0 6 l7 -3 M4 10 l5 -2',stroke:'#ffffff','stroke-width':'.8',opacity:'.55'},pattern)}
 else{el('circle',{cx:step*.28,cy:step*.4,r:name==='grain'?.8:1.2,fill:'#fff',opacity:'.52'},pattern);el('circle',{cx:step*.68,cy:step*.76,r:'.7',fill:'#101527',opacity:'.4'},pattern)}
}
// Shared procedural paper surfaces and edge distortions. Fog deliberately stays untextured.
for(const edge of ['cut','torn','deckle'])for(const texture of ['card','fiber','grain','none']){
 const filter=el('filter',{id:'paper-'+edge+'-'+texture,x:'-12%',y:'-12%',width:'124%',height:'124%','color-interpolation-filters':'sRGB'});
 if(edge!=='cut'){
  filter.appendChild(el('feTurbulence',{type:'fractalNoise',baseFrequency:edge==='torn'?'0.055':'0.023',numOctaves:2,seed:7,result:'roughness'}));
  filter.appendChild(el('feDisplacementMap',{in:'SourceGraphic',in2:'roughness',scale:edge==='torn'?5:2.5,xChannelSelector:'R',yChannelSelector:'G',result:'edged'}));
 }
 const source=edge==='cut'?'SourceGraphic':'edged';
 if(texture==='none'){filter.appendChild(el('feMerge',{},filter)).appendChild(el('feMergeNode',{in:source}));}
 else{
  const density={card:0.34,fiber:0.09,grain:0.67}[texture];
  filter.appendChild(el('feTurbulence',{type:'fractalNoise',baseFrequency:density,numOctaves:texture==='fiber'?3:2,seed:11,result:'textureNoise'}));
  filter.appendChild(el('feColorMatrix',{in:'textureNoise',type:'saturate',values:0,result:'grayNoise'}));
  // Restrict texture to the actual paper silhouettes, preserving transparency.
  filter.appendChild(el('feComposite',{in:'grayNoise',in2:source,operator:'in',result:'maskedGrain'}));
  filter.appendChild(el('feBlend',{in:source,in2:'maskedGrain',mode:'soft-light',result:'paperResult'}));const end=el('feMerge',{},filter);end.appendChild(el('feMergeNode',{in:'paperResult'}));
 }

function sync(){let item=state.layers[selected];document.getElementById('depth').disabled=!item;document.getElementById('color').disabled=!item;if(item){document.getElementById('depth').value=item.depth;document.getElementById('color').value=item.color}document.getElementById('variation').disabled=!item;document.getElementById('gradient').disabled=!item;if(item){document.getElementById('variation').value=String(item.variation||0);document.getElementById('gradient').value=item.gradient||'flat'}for(const field of ['edge','texture']){document.getElementById(field).disabled=!item;document.getElementById(field).value=item?(item[field]||(field==='edge'?'cut':'card')):(field==='edge'?'cut':'card')}document.getElementById('light-angle').value=state.lightAngle??35;document.getElementById('shadow-distance').value=state.shadowDistance??7;document.getElementById('layer-size').disabled=!item;document.getElementById('layer-height').disabled=!item;document.getElementById('layer-size').value=item?.size||100;document.getElementById('layer-size-value').textContent=(item?.size||100)+'%';document.getElementById('layer-height').value=item?.height||0;document.getElementById('layer-height-value').textContent=String(item?.height||0);document.getElementById('theme').value=state.theme;notify(item?'Selected '+item.kind:'Tap a shape to edit it')}
